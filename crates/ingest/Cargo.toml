[package]
name = "pollywiki-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Source syncs, normalisation and derived bundles for pollywiki"

[[bin]]
name = "pollywiki-ingest"
path = "src/main.rs"

[dependencies]
pollywiki-schema = { path = "../schema" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
regex.workspace = true
chrono.workspace = true
csv = "1"
percent-encoding = "2"
# "rustls" selects the SDK's legacy connector, which pins rustls 0.21 and its
# unpatched rustls-webpki 0.101; "default-https-client" is the modern stack.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "sso"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
