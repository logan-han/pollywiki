# Coverage is reported, never gating. What is left uncovered is almost entirely
# the ingest crate's network and S3 code paths, which need an injectable HTTP
# layer before they can be tested; the rendering and normalisation layers are
# covered by unit tests plus a whole-site build over the sample bundles.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "infra/**"
