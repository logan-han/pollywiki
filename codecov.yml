# Coverage is reported, never gating. Every source sync runs end to end in tests
# against a local HTTP server (see crates/ingest/src/test_http.rs), which each
# source reaches because its endpoint is a value rather than a constant. The S3
# store answers to the same stub, and both binaries' argument dispatch is driven
# through the built executable (crates/*/tests/cli.rs). What is left uncovered is
# the two fixture tests that only run against a local development store.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "infra/**"
