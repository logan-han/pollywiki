# Coverage is reported, never gating: the site crate is mostly string
# templating exercised by the sample-data build, not by unit tests.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "crates/site/src/main.rs" # binary entrypoint: build/serve plumbing
  - "infra/**"
