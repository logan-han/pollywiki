# Coverage is reported, never gating. Every source sync now runs end to end in
# tests against a local HTTP server (see crates/ingest/src/test_http.rs), which
# each source reaches because its endpoint is a value rather than a constant.
# What is left uncovered is main()'s argument dispatch and the live S3 client.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "infra/**"
